[package]
name = "cortex-api"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_http = "1.3"
lambda_runtime = "1.3"
aws-config = "1.10"
aws-sdk-dynamodb = "1.119"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }