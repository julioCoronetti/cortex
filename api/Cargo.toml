[package]
name = "cortex-api"
version = "0.1.0"
edition = "2021"

[dependencies]
lambda_http = "0.14"
lambda_runtime = "0.14"
aws-config = "1.65"
aws-sdk-dynamodb = "1.65"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }